<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Сахабалар өмірбаянын қазақша және орысша оқуға арналған жеңіл энциклопедиялық сайт." />
  <title>Сахабалар — оқу энциклопедиясы</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="#/" aria-label="Басты бет">
        <span class="brand-mark">س</span>
        <span>
          <strong data-i18n="brandTitle">Сахабалар</strong>
          <small data-i18n="brandSubtitle">Өмірбаяндар жинағы</small>
        </span>
      </a>

      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Тақырыпты ауыстыру" title="Тақырып">◐</button>
        <div class="lang-switch" aria-label="Тіл таңдау">
          <button class="lang-btn is-active" type="button" data-lang="kk">ҚАЗ</button>
          <button class="lang-btn" type="button" data-lang="ru">РУС</button>
        </div>
      </div>
    </header>

    <main id="app" class="content"></main>

    <footer class="site-footer">
      <p data-i18n="footerText">Материалдарды жарияламас бұрын сенімді классикалық және заманауи дереккөздермен тексеріңіз.</p>
    </footer>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
